name: Crawl kanxue articles

# Runs tools/kanxue-crawler/update.sh: rescan the 看雪 Android 精华 board, fetch any
# thread not already in output/done.json, sync the new markdown into
# skills/reverse-skill/kb/articles/, commit and push.  When articles actually changed
# it then dispatches kb-index.yml to rebuild INDEX.md + embeddings.npy.
#
# Why an explicit dispatch instead of letting kb-index.yml's `on: push` fire: a push
# made with GITHUB_TOKEN does not create new workflow runs.  workflow_dispatch and
# repository_dispatch are the two documented exceptions, so we use the former.
# (kb-index.yml keeps its push trigger for pushes made by a human.)
#
# Requires CLOAKBROWSER_LICENSE_KEY for the pinned browser download and
# KANXUE_SESSION_STATE for the crawler's logged-in cookie jar. Refresh the latter with
#   python crawl.py login
# and store the resulting .session-state.json as the secret. Cookies rotate, so an
# untouched secret goes stale eventually - the job fails loudly when the session dies.
#
# 安全验证 used to be the hard stop for this job: kanxue serves a 网易易盾 jigsaw slider
# and a headless runner had nobody to drag it. tools/slider-cv now locates the gap with
# OpenCV (contour-orientation matched filter + masked ZNCC + a veil detector, voting)
# and drags the handle with a closed loop on the piece's measured position, so the
# crawl clears the interstitial by itself. `captcha_debug` keeps every attempt's images
# and an annotated overlay, uploaded as an artifact - that is the first thing to look
# at if the pass rate ever drops (usually because 易盾 changed how it draws the gap).

on:
  schedule:
    # 03:17 UTC daily - off the hour so it does not pile onto the scheduler's peak.
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      unlock:
        description: "点赞 gated threads to unlock them (writes to the forum under your account)"
        type: boolean
        default: true
      extra_args:
        description: "Extra flags forwarded to crawl.py (e.g. --no-replies)"
        type: string
        default: ""
      captcha_debug:
        description: "Keep every 安全验证 slider attempt (images + annotated gap) as an artifact"
        type: boolean
        default: false

permissions:
  contents: write   # commit the articles + crawler state
  actions: write    # dispatch kb-index.yml

# Two crawls at once would fight over done.json and double-fetch threads.
concurrency:
  group: kb-crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      # Full history: the crawl can run for the better part of an hour, and the push
      # below rebases onto whatever landed meanwhile (kb-index.yml commits to main too).
      # A shallow clone has no merge base to rebase against.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache pinned CloakBrowser archive
        uses: actions/cache@v4
        with:
          path: tools/cloakbrowser-ci/runtime/cache
          key: cloakbrowser-linux-x64-150.0.7871.114.6-6c79c5b0794368ce

      - name: Build the crawler browser image
        run: docker build -f tools/cloakbrowser-ci/Dockerfile -t cloakbrowser-crawler:150 .

      - name: Fetch and verify the pinned browser
        env:
          CLOAKBROWSER_LICENSE_KEY: ${{ secrets.CLOAKBROWSER_LICENSE_KEY }}
        run: |
          if [ -z "$CLOAKBROWSER_LICENSE_KEY" ]; then
            echo "::error::CLOAKBROWSER_LICENSE_KEY is not set"
            exit 1
          fi
          docker run --rm \
            -e CLOAKBROWSER_LICENSE_KEY \
            -v "$PWD:/repo" \
            cloakbrowser-crawler:150 fetch

      - name: Verify no-key baseline and concurrent patched instances
        run: |
          docker run --rm \
            --cap-add=SYS_PTRACE \
            --security-opt seccomp=unconfined \
            -v "$PWD:/repo" \
            cloakbrowser-crawler:150 verify-target

      - name: Restore the 看雪 session
        env:
          KANXUE_SESSION_STATE: ${{ secrets.KANXUE_SESSION_STATE }}
        run: |
          if [ -z "$KANXUE_SESSION_STATE" ]; then
            echo "::error::KANXUE_SESSION_STATE is not set.  Run 'python crawl.py login'"
            echo "::error::locally and store .session-state.json as that repo secret."
            exit 1
          fi
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e KANXUE_SESSION_STATE \
            -v "$PWD:/repo" \
            cloakbrowser-crawler:150 restore-session

      - name: Record starting commit
        id: before
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Crawl and sync to the KB
        env:
          # Guard on the event: on a schedule `inputs.unlock` is null, and GitHub's loose
          # equality makes `null == false` true - which would silently disable unlocking
          # on exactly the runs that are supposed to have it on.
          UNLOCK: ${{ (github.event_name == 'workflow_dispatch' && inputs.unlock == false) && '--no-unlock' || '' }}
          EXTRA: ${{ inputs.extra_args }}
          # Path is inside the bind-mounted checkout so the artifact step can find it.
          CAPTCHA_DEBUG: ${{ inputs.captcha_debug && '--captcha-debug-dir /repo/tools/kanxue-crawler/output/captcha-debug' || '' }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # --no-push: update.sh commits the articles, this workflow owns the push so it
          # can bundle the crawler-state commit and then dispatch the index rebuild.
          # Match the runner's UID/GID so the container's article commit does not leave
          # root-owned files such as .git/COMMIT_EDITMSG in the bind-mounted checkout.
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            --cap-add=SYS_PTRACE \
            --security-opt seccomp=unconfined \
            -v "$PWD:/repo" \
            cloakbrowser-crawler:150 \
            crawl tools/kanxue-crawler/update.sh --headless --no-push $UNLOCK $CAPTCHA_DEBUG $EXTRA

      # Only written when captcha_debug was requested, or left behind by a failed run.
      - name: Upload 安全验证 slider debug images
        if: always() && hashFiles('tools/kanxue-crawler/output/captcha-debug/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: captcha-debug
          path: tools/kanxue-crawler/output/captcha-debug
          retention-days: 7

      # Decided here, before the push rebases and makes `before.sha` a non-ancestor.
      - name: Did the corpus move?
        id: corpus
        run: |
          n=$(git diff --name-only "${{ steps.before.outputs.sha }}" HEAD \
                -- skills/reverse-skill/kb/articles | wc -l | tr -d ' ')
          echo "changed=$n" >> "$GITHUB_OUTPUT"
          echo "$n article file(s) changed"

      - name: Commit crawler state
        run: |
          git add -- tools/kanxue-crawler/output
          if git diff --cached --quiet; then
            echo "crawler state unchanged"
          else
            git commit -q -m "chore(crawler): update kanxue crawl state [skip ci]"
          fi

      - name: Push
        run: |
          if [ "$(git rev-parse HEAD)" = "${{ steps.before.outputs.sha }}" ]; then
            echo "nothing new this run"
            exit 0
          fi
          git fetch origin "${{ github.ref_name }}"
          git rebase "origin/${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"

      # kb-index.yml is expensive (torch + ~90s of embedding), so only wake it when the
      # corpus really moved.  A state-only commit must not trigger a rebuild.
      - name: Trigger the index rebuild
        if: steps.corpus.outputs.changed != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run kb-index.yml --ref "${{ github.ref_name }}"

      # An unsolved captcha or an expired session lands threads in failed.json rather
      # than crashing the crawl, which would otherwise look like a clean run.
      - name: Report failed threads
        if: always()
        run: |
          python - <<'PY'
          import json, os
          p = "tools/kanxue-crawler/output/failed.json"
          failed = json.load(open(p)) if os.path.exists(p) else {}
          if not failed:
              print("no failed threads")
              raise SystemExit(0)
          for tid, meta in list(failed.items())[:20]:
              print(f"{tid}: {meta.get('error','?')}")
          captcha = sum(1 for m in failed.values() if "CaptchaRequired" in (m.get("error") or ""))
          msg = f"{len(failed)} thread(s) failed"
          if captcha:
              # The slider solver clears these unattended, so a CaptchaRequired here means
              # it genuinely could not - re-run with captcha_debug to see what it saw.
              msg += (f"; {captcha} could not clear the 安全验证 slider - re-run this workflow "
                      "with captcha_debug enabled and inspect the artifact, and check the "
                      "session secret is still valid")
          else:
              msg += " - check the log above; an expired KANXUE_SESSION_STATE is the usual cause"
          print(f"::warning::{msg}")
          PY
