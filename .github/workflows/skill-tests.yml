name: Skill compatibility tests
on:
  push:
    paths:
      - 'install.sh'
      - 'tools/install_skill.py'
      - 'tests/**'
      - 'skills/reverse-skill/**'
      - '.github/workflows/skill-tests.yml'
  pull_request:
    paths:
      - 'install.sh'
      - 'tools/install_skill.py'
      - 'tests/**'
      - 'skills/reverse-skill/**'
      - '.github/workflows/skill-tests.yml'
permissions:
  contents: read
jobs:
  compatibility:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest discover -s skills/reverse-skill/tests -v
